name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          APP_URL: ${{ vars.APP_URL }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk PalcoKaraoke.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PalcoKaraoke-apk
          path: PalcoKaraoke.apk
      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Palco Karaokê 1.${{ github.run_number }}
          files: PalcoKaraoke.apk
