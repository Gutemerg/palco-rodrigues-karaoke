plugins { id 'com.android.application' }

android {
    namespace 'com.rodrigues.palco'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rodrigues.palco'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
        buildConfigField 'String', 'APP_URL', '"' + (System.getenv('APP_URL') ?: 'https://palco-rodrigues-karaoke.vercel.app/') + '"'
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        palco {
            storeFile file('palco.keystore')
            storePassword 'palcokaraoke'
            keyAlias 'palco'
            keyPassword 'palcokaraoke'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.palco
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
